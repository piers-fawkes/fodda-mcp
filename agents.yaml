# agents.yaml — Agent Mapping Manifest
# Per the Fodda Engineering Standards & Code Policy for Agents.
# This file points to where agent configurations live in this repo.
# It does NOT force a directory restructure — it provides a discovery map.
#
# Tech debt note: null values below indicate items logged in BACKBURNER.md.
# Do NOT pre-create empty directories. Add paths here only when files exist.

