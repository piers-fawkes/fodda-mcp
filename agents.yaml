# ── External Prompt Audit (Policy §4) ────────────────────────────────────────
# Policy requires: prompts outside version control MUST have a documented audit trail.
# Fodda MCP compliance status:
#   ✅ System prompt: 100% in-repo (src/systemPrompt.ts → buildSystemPrompt())
#   ✅ Tool descriptions: in-repo (src/toolHandlers.ts, src/tools.ts)
#   ⚠️  Airtable dependency: pricingCache.ts fetches PRICING DATA from Airtable,
#      NOT system instructions. Falls outside this policy's scope, but changes to
#      pricing rules that affect agent behavior must have a CHANGELOG entry.
#      (BACKBURNER: MCP Tool Descriptions from Airtable — if that ships, it will
#       require an audit trail per this policy before going live.)

# ── Environment Lifecycle Defaults ────────────────────────────────────────────
# Per policy §5: document fork/reuse rules and network egress controls.
environment:
  default_behavior: reuse          # reuse conversation state within a session
  fork_on: new_user_session        # fork environment per user session
  network_egress: fodda_api_only   # agents may not make arbitrary outbound calls
  snapshot_on_deploy: true         # export environment snapshot before config changes

# ── Path Conventions ──────────────────────────────────────────────────────────
# Standard locations used across all Fodda repos (per policy §2).
conventions:
  workflows: .agents/workflows/
  briefs: briefs/
  personas: .agents/personas/      # create this dir only when first persona file is ready
  policies: .agents/policies/      # create this dir only when first policy file is ready
  scratch: .agents/scratch/        # gitignored — temp artifacts and logs
